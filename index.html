<!doctype html>
<html lang="az"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>AZERBAIJAN CITY DRIVE</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#18242b;font-family:Arial;touch-action:none}canvas{display:block;width:100%;height:100%}
#hud{position:fixed;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;gap:5px;pointer-events:none;flex-wrap:wrap}.tag{background:#071522dc;color:white;padding:7px 9px;border-radius:9px;font-weight:bold;font-size:12px}
#controls{position:fixed;bottom:14px;left:0;right:0;display:flex;justify-content:space-between;padding:0 12px;pointer-events:none}.group{display:flex;gap:8px;pointer-events:auto}button{color:white;background:#071827df;border:1px solid #ffffff88;font-weight:bold;touch-action:none}.steer{width:60px;height:60px;border-radius:50%;font-size:23px}.pedal{width:65px;height:65px;border-radius:50%;font-size:11px}
#menu{position:fixed;inset:0;background:#071522eF;display:grid;place-items:center;padding:15px;color:white}#panel{width:min(440px,100%);background:#123149;padding:20px;border-radius:18px;text-align:center}h1{font-size:24px}.choice{padding:12px;border-radius:10px;background:#17618a;margin:6px;width:46%;font-size:14px}.start{padding:14px 28px;background:#d52d43;border:0;border-radius:12px;font-size:16px;margin-top:10px}
</style></head><body>
<canvas id="game"></canvas><div id="hud"><div class="tag">🇦🇿 AZERBAIJAN CITY DRIVE</div><div class="tag">🚘 <span id="carname">Changan A07</span></div><div class="tag">⚡ <span id="speed">0</span> km/saat</div></div>
<div id="controls" style="display:none"><div class="group"><button class="steer" id="left">◀</button><button class="steer" id="right">▶</button></div><div class="group"><button class="pedal" id="brake">ƏYLƏC</button><button class="pedal" id="gas">QAZ</button></div></div>
<div id="menu"><div id="panel"><h1>🇦🇿 AZERBAIJAN CITY DRIVE</h1><p>Şəhərdə sür, NPC maşınlarından yayın və sükanı idarə et.</p><button class="choice" onclick="start('free')">🚗 Sərbəst sürüş</button><button class="choice" onclick="start('traffic')">🚦 Şəhər trafiki</button><br><button class="start" onclick="start('free')">OYUNA BAŞLA</button><p style="font-size:12px">İdarəetmə: ◀ ▶ sükan · QAZ · ƏYLƏC</p></div></div>
<script>
const c=document.getElementById('game'),ctx=c.getContext('2d');let W,H,dpr=1;
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
let active=false,gas=false,brake=false,left=false,right=false,speed=0,steer=0,offset=0,carX=0,mode='free',last=0;
const traffic=Array.from({length:9},(_,i)=>({lane:(i%3)-1,z:i*145+120,color:['#d8dce0','#b82935','#263f5c','#d8ad35','#eeeeee','#222831'][i%6],type:i%5===0?'van':'car'}));
function rounded(x,y,w,h,r,col){ctx.fillStyle=col;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function drawCar(x,y,w,h,color,player=false){ctx.save();ctx.translate(x,y);
 // wheels
 rounded(-w*.55,-h*.28,w*.17,h*.25,4,'#101418');rounded(w*.38,-h*.28,w*.17,h*.25,4,'#101418');rounded(-w*.55,h*.05,w*.17,h*.25,4,'#101418');rounded(w*.38,h*.05,w*.17,h*.25,4,'#101418');
 // body silhouette
 rounded(-w/2,-h/2,w,h,Math.max(7,w*.15),color);
 // glass cabin and roof
 rounded(-w*.36,-h*.23,w*.72,h*.43,7,'#182f40');rounded(-w*.29,-h*.19,w*.58,h*.15,4,'#5e8295');
 ctx.fillStyle='#b6d3df';ctx.fillRect(-w*.34,-h*.02,w*.68,h*.025);
 // lamps and bumper
 rounded(-w*.40,-h*.48,w*.22,h*.07,3,'#f5f2d4');rounded(w*.18,-h*.48,w*.22,h*.07,3,'#f5f2d4');
 rounded(-w*.40,h*.40,w*.22,h*.07,3,'#f22b3d');rounded(w*.18,h*.40,w*.22,h*.07,3,'#f22b3d');
 if(player){rounded(-w*.12,-h*.48,w*.24,h*.035,2,'#9baab2')}
 ctx.restore()}
function road(){let horizon=H*.18,center=W*.5+Math.sin(offset*.001)*W*.025;ctx.fillStyle='#78a46b';ctx.fillRect(0,0,W,H); // distant city
 for(let i=0;i<18;i++){let x=(i*137+offset*.08)% (W+100)-50,hh=35+(i*31%90);ctx.fillStyle=['#899ca2','#b8a995','#8da8b2'][i%3];ctx.fillRect(x,horizon-hh,45,hh)}
 ctx.fillStyle='#33383d';ctx.beginPath();ctx.moveTo(center-W*.18,horizon);ctx.lineTo(center+W*.18,horizon);ctx.lineTo(W*1.15,H);ctx.lineTo(-W*.15,H);ctx.closePath();ctx.fill();
 // road edge and lane markings
 ctx.strokeStyle='#e8e4d6';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(center-W*.18,horizon);ctx.lineTo(-W*.15,H);ctx.moveTo(center+W*.18,horizon);ctx.lineTo(W*1.15,H);ctx.stroke();
 for(let lane of [-.333,.333]){ctx.strokeStyle='#f3efdf';ctx.lineWidth=2;for(let z=0;z<12;z++){let t=((z/12+offset*.0009)%1),y=horizon+(H-horizon)*t*t,x=center+lane*(W*.36*t);ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x,y+Math.max(3,t*24));ctx.stroke()}}
 // sidewalks
 ctx.fillStyle='#aeb4b3';ctx.fillRect(0,horizon-5,W,5)}
function frame(t){let dt=Math.min((t-last)/1000||0,.04);last=t;if(active){if(gas)speed=Math.min(34,speed+9*dt);else speed=Math.max(0,speed-2.4*dt);if(brake)speed=Math.max(0,speed-18*dt);let target=(right?1:0)-(left?1:0);steer+=(target-steer)*Math.min(1,dt*5);carX=Math.max(-.82,Math.min(.82,carX+steer*speed*.00075*dt*60));offset+=speed*dt*35;traffic.forEach(n=>{n.z-=speed*dt*2.2;if(n.z< -80)n.z=H+Math.random()*450})}
 road();let center=W*.5+Math.sin(offset*.001)*W*.025,horizon=H*.18;
 traffic.slice().sort((a,b)=>a.z-b.z).forEach(n=>{let y=horizon+(n.z/Math.max(H,1))*(H-horizon),depth=Math.max(.22,Math.min(1.15,n.z/H)),x=center+n.lane*W*.12*depth;drawCar(x,y,30*depth,58*depth,n.color)});
 drawCar(center+carX*W*.19,H*.79,Math.min(75,W*.16),Math.min(132,H*.22),'#f1f2f3',true);
 document.getElementById('speed').textContent=Math.round(speed*3.6);requestAnimationFrame(frame)}
function start(m){mode=m;active=true;document.getElementById('menu').style.display='none';document.getElementById('controls').style.display='flex';}
function bind(id,fn){let e=document.getElementById(id);e.addEventListener('pointerdown',ev=>{ev.preventDefault();fn(true);e.setPointerCapture(ev.pointerId)});['pointerup','pointercancel','lostpointercapture'].forEach(k=>e.addEventListener(k,()=>fn(false)))}
bind('gas',v=>gas=v);bind('brake',v=>brake=v);bind('left',v=>left=v);bind('right',v=>right=v);
addEventListener('keydown',e=>{if(e.key==='ArrowUp'||e.key==='w')gas=true;if(e.key==='ArrowDown'||e.key==='s')brake=true;if(e.key==='ArrowLeft'||e.key==='a')left=true;if(e.key==='ArrowRight'||e.key==='d')right=true});
addEventListener('keyup',e=>{if(e.key==='ArrowUp'||e.key==='w')gas=false;if(e.key==='ArrowDown'||e.key==='s')brake=false;if(e.key==='ArrowLeft'||e.key==='a')left=false;if(e.key==='ArrowRight'||e.key==='d')right=false});
requestAnimationFrame(frame);
</script></body></html>
